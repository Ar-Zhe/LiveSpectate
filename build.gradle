//
// 濞夈劍鍓伴敍姘⒈娑?jar 閻?modId 閻╃鎮撻敍灞藉涧閼虫垝绨╅柅澶夌閺€鎹愮箻 mods/閿涘奔绗夌憰浣告倱閺冩儼顥婇妴?// ---------------------------------------------------------------------------
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Server-only jar: same mod without the F9 panel (client + network code stripped).'
    archiveClassifier = 'server'
    from sourceSets.main.output
    exclude 'com/livespectate/client/**'
    exclude 'com/livespectate/network/**'
    exclude 'assets/**'
    manifest {
        attributes([
                'Specification-Title'   : 'LiveSpectate (server-only)',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'LiveSpectate',
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('serverJar')
}
