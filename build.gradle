plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'com.livespectate'
version = '1.1.1'
base {
    archivesName = 'livespectate-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net'
    }
}

neoForge {
    // NeoForge for Minecraft 1.21.1
    version = '21.1.248'

    // Mojang official mappings are the default; no parchment needed for a server-side mod.
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        livespectate {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : 'LiveSpectate',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'LiveSpectate',
                'Implementation-Version': project.version
        ])
    }
}

