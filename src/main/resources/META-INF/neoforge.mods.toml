loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://example.invalid/livespectate/issues"

[[mods]]
modId = "livespectate"
version = "1.1.1"
displayName = "LiveSpectate"
authors = "LiveSpectate contributors"
description = '''
服务端旁观/附体直播模组 (NeoForge 1.21.1)。

/livespectate <玩家>          附体到某个玩家视角
/livespectate auto start [秒]  定时自动切换附体目标
/livespectate auto stop       停止自动轮换（保持当前附体）
/livespectate auto status     查看自动轮换状态
/livespectate auto next       立即切换到下一个目标
/livespectate stop            停止轮换并退出附体，恢复原状态
/livespectate reload          重载配置文件

按 F9 打开图形控制面板（客户端也装了本模组时可用）：
在线玩家列表点击即附体，并可开始/停止自动轮换、切换下一个目标、退出附体、重载配置。
'''

[[dependencies.livespectate]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.livespectate]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
